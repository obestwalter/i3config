# Wayland: grim/slurp instead of scrot, wshowkeys instead of screenkey, swaylock instead of i3lock.
# No xdotool Escape trick needed: leave the mode with "; mode default".
set ccp CENTRAL-CONTROL-PROGRAM   =>  g: screenshot  k: screenkey  l: lock  s: suspend  t: touchpad  u: unclutter
bindsym $win+c mode "$ccp"
mode "$ccp" {
    bindsym g exec "$bin/screenshot.sh full"; mode "default"
    bindsym k exec "$bin/toggle-screenkey.sh"; mode "default"
    bindsym l exec "$lockCommand"; mode "default"
    bindsym s exec "systemctl suspend"; mode "default"
    bindsym t exec "$bin/toggle-touchpad.sh"; mode "default"
    bindsym u exec "$bin/toggle-unclutter.sh"; mode "default"
    bindsym Escape mode "default"
}

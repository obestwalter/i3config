# Replaces mode-i3configger.conf. There is no i3configger in this setup:
# sway builds the config from config.d itself via "include" (see ../config).
# Colour schemes are switched with bin/sway-colors.sh (symlink + reload).
set $swc sway  =>  Left/Right: prev/next colors  Up/Down: bar top/bottom  r: reload  x: exit
bindsym $win+w mode "$swc"
mode "$swc" {
    bindsym Left exec "$bin/sway-colors.sh prev"; mode "default"
    bindsym Right exec "$bin/sway-colors.sh next"; mode "default"
    bindsym Up bar main position top; mode "default"
    bindsym Down bar main position bottom; mode "default"

    # sway has no "restart", reload is all there is
    bindsym r reload; exec notify-send -a 'CENTRAL-CONTROL-PROGRAM' 'sway reloaded'; mode "default"
    bindsym x exec swaynag -t warning -m 'Exit sway?' -B 'Yes' 'swaymsg exit'; mode "default"

    bindsym Escape mode "default"
}

# swaybar replaces i3bar, py3status still works as status_command (output_format = "i3bar")
bar {
    id main
    swaybar_command swaybar
    status_command py3status \
        --dbus-notify \
        --timeout 1 \
        -c $swayHome/i3bar.full.conf \
        -i $swayHome/py3status \
        -l /tmp/py3status.swaybar.log
    position bottom
    tray_padding 1
    font pango:DejaVu Sans Mono 15, FontAwesome 15
    mode dock
    modifier $win
    bindsym --release button3 exec $bin/screenshot-and-gwenview.sh
    bindsym button4 nop
    bindsym button5 nop
    separator_symbol " ║ "
    colors {
        background $base03
        statusline $red
        separator  $base03
        focused_background $base2
        focused_statusline $blue
        focused_separator  $base1
        focused_workspace  $blue $blue $base3
        active_workspace   $blue $base02 $blue
        inactive_workspace $base02 $base02 $base1
        urgent_workspace   $base3 $orange $base3
        binding_mode       $base3 $orange $base3
    }
}

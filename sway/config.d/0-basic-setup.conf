# Basic variables (sway reads ~/.config/sway/config, this is included from there)
set $swayHome ~/.config/sway
set $bin $swayHome/bin
set $configsOther $swayHome/configs-other

# Main modifiers
set $alt Mod1
set $win Mod4
floating_modifier $win

# Workspaces

# https://fontawesome.com/cheatsheet/free/solid
# https://fontawesome.com/v5/search
#       

set $ws1 " 1:   "
set $ws2 " 2: |  "
set $ws3 " 3:   "
set $ws4 " 4: |  "
set $ws5 " 5:   "
set $ws6 " 6:   "
set $ws7 " 7:   "
# 8 -> remote connections
set $ws8 " 8:   "
# 9 -> admin / monitoring / logs
set $ws9 " 9:  "
# 10 -> browser / secondary
set $ws10 "10:  "

# Settings
focus_follows_mouse no
mouse_warping output
workspace_auto_back_and_forth no
focus_on_window_activation smart
workspace_layout tabbed
default_floating_border normal 3
default_border normal 1
hide_edge_borders smart

# Design

set fontSize 14
font "pango:DejaVu Sans Mono $fontSize , FontAwesome $fontSize"

client.background       #000000
client.focused          $cfbr  $cfbg  $cftxt  $cfind  $cfchildb
client.unfocused        $cubr  $cubg  $cutxt  $cuind  $cuchildb
client.focused_inactive $cfibr $cfibg $cfitxt $cfiind $cfichildb
client.urgent           $curbr $curbg $curtxt $curind $curchildb
client.placeholder      $cpbr  $cpbg  $cptxt  $cpind  $cpchildb

### Other colors
set $lockColor $orange

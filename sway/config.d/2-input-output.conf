# Replaces xinput / xrandr / nitrogen / unclutter from the i3 setup.
# List devices:  swaymsg -t get_inputs
# List outputs:  swaymsg -t get_outputs
# Keysym names:  wev

# Keyboard (German layout, the key bindings use numbersign, udiaeresis, asciicircum)
input type:keyboard {
    xkb_layout de
    # xkb_options caps:escape
}

# Touchpad (was bin/touchpad_settings.sh via xinput)
input type:touchpad {
    tap enabled
    drag_lock enabled
    # natural_scroll enabled
    # dwt enabled
}

# Mouse cursor hides after 1s without movement (was unclutter, toggle with bin/toggle-unclutter.sh)
seat * hide_cursor 1000

# Wallpaper (was nitrogen --restore)
output * bg ~/Pictures/wallpapers/single_screen/generative-orange.png fill

# Monitors (was xrandr scripts in bin/inactive)
# output eDP-1 resolution 1920x1080 position 0 0 scale 1
# output HDMI-A-1 resolution 2560x1440 position 1920 0

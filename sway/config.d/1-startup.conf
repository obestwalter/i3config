# Wayland replacements for the X11 startup tools:
#   xset -dpms         -> swayidle / "output * dpms" (see 2-input-output.conf)
#   unclutter          -> "seat * hide_cursor" (see 2-input-output.conf)
#   nitrogen/feh       -> "output * bg" (see 2-input-output.conf)
#   touchpad-settings  -> "input type:touchpad" (see 2-input-output.conf)
#   picom              -> not needed (sway composites itself, see "blur"/"shadows" in sway >= 1.11 or SwayFX)

# exec (not exec_always) so a config reload does not start a second instance
exec dunst -config $configsOther/dunstrc -markup full

# lock after 10 min, switch off outputs after 15 min, lock before suspend
exec swayidle -w \
    timeout 600 '$lockCommand' \
    timeout 900 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
    before-sleep '$lockCommand'

# clipboard history (optional): wl-paste --watch cliphist store
# exec wl-paste --watch cliphist store
